name: CAHEZ Workforce Dashboard CI

on:
  pull_request:
    paths:
      - "apps/workforce-dashboard/**"
      - ".github/workflows/cahez-workforce-dashboard-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/workforce-dashboard/**"
      - ".github/workflows/cahez-workforce-dashboard-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workforce-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
