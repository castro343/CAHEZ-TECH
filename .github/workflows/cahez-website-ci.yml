name: CAHEZ corporate website CI

on:
  pull_request:
    paths:
      - "apps/corporate-website/**"
      - ".github/workflows/cahez-website-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/corporate-website/**"
      - ".github/workflows/cahez-website-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/corporate-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
